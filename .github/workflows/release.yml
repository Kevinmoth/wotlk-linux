name: Release

on:
  push:
    branches: [main, port/linux]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x64:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build g++ \
            libsdl3-dev libwayland-dev libcurl4-openssl-dev libasound2-dev libvulkan-dev libxvidcore-dev

      - name: Configure
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWOWDECOMP_DISABLE_SIGNATURE_CHECKS=ON \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"

      - name: Build WowClient
        run: cmake --build build/linux --target WowClient -j"$(nproc)"

      - name: Package
        run: tar czf wowdecomp-linux-x86_64.tar.gz -C bin/Linux WowClient64

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: wowdecomp-linux-x86_64.tar.gz

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build/x64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DWOWDECOMP_DISABLE_SIGNATURE_CHECKS=ON

      - name: Build WowClient
        run: cmake --build build/x64 --target WowClient --parallel

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path bin/Win/WowClient64.exe -DestinationPath wowdecomp-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: wowdecomp-windows-x64.zip

  publish:
    if: >-
      always() &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      needs.linux-x64.result == 'success' &&
      needs.windows-x64.result == 'success'
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF' | sed 's/^          //'
          **Cliente 3.3.5a decompilado portado a Linux — build ALPHA para testers.**

          Requisitos: tu propio cliente **WoW 3.3.5a (12340)**. Coloca su carpeta `Data` junto al binario, o arranca con `-datadir /ruta/al/cliente`. Apunta `Data/<locale>/realmlist.wtf` a tu servidor. Este build trae las verificaciones de firma desactivadas: la data moddeada de servidores privados (parches custom) carga tal cual.

          Verificado por el mantenedor: login, mundo, cámara (click derecho + arrastre), redimensionado de ventana y conexión a servidor — bajo WSL/Dozen. **Linux nativo aún no ha sido verificado por nosotros: este alpha ES la prueba.** En nativo con drivers Vulkan reales se espera rendimiento de clase Windows; en WSL va degradado (~20 FPS, ver `docs/port/WSL_RUNBOOK.md` en el repo).

          Incidencias conocidas en `docs/port/KNOWN_ISSUES_VULKAN.md`. Reporta bugs en los issues de este repositorio. Créditos: [SatyPardus/wowdecomp](https://github.com/SatyPardus/wowdecomp) (la decompilación) y [RosemyneH](https://github.com/RosemyneH) (gran parte del port).

          | Archivo | Plataforma |
          |---------|-----------|
          | `wowdecomp-linux-x86_64.tar.gz` | Linux x86_64 |
          | `wowdecomp-windows-x64.zip` | Windows x64 |
          EOF
          )
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --notes "$notes"
          else
            gh release delete continuous --yes --cleanup-tag || true
            gh release create continuous dist/* --prerelease --target "$GITHUB_SHA" --title "Latest build" --notes "$notes"
          fi
